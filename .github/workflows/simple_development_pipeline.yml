name: Deployment pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches: [development]
    types: [opened, synchronize]

jobs:
  main:
    name: simple_deployment_pipeline
    runs-on: ubuntu-22.04
    steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-node@v4
         with:
           node-version: '22'
       - name: Install dependencies
         run: npm install 
       - name: Check style
         run: npm run eslint
       - name: build
         run: npm run build
      #  - name: test
      #    run: npm run test
       - name: npm run eslint
         run: npm eslint
       - name: npx prettier 
         run: npx prettier . --write
